<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>PromoConn - Arte</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 1080px;
            height: 1350px;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #ffffff;
        }


        /* =====================================================
           ÁREA TOTAL DA ARTE
           ===================================================== */

        .arte {
            position: relative;

            width: 1080px;
            height: 1350px;

            overflow: hidden;

            background: #ffffff;
        }


        /* =====================================================
           PLANO DE FUNDO
           ===================================================== */

        .plano-fundo {
            position: absolute;

            top: 0;
            left: 0;

            width: 1080px;
            height: 1350px;

            display: block;

            object-fit: cover;

            z-index: 1;
        }


        /* =====================================================
           ÁREA DA IMAGEM DO PRODUTO
           ===================================================== */

        .area-produto {
            position: absolute;

            top: 385px;
            left: 660px;

            width: 500px;
            height: 300px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.15);

            z-index: 2;

            overflow: visible;
        }


        /* =====================================================
           IMAGEM DO PRODUTO
           ===================================================== */

        .imagem-produto {
            display: block;

            width: 500px;
            height: 300px;

            object-fit: contain;

            background: transparent;
        }


        /* =====================================================
           DESCRIÇÃO DO PRODUTO
           ===================================================== */

        .descricao-produto {
            position: absolute;

            top: 450px;
            left: 80px;

            width: 550px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 45px;

            font-weight: 900;

            line-height: 1.15;

            color: #07194a;

            text-align: left;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

            overflow: hidden;

            z-index: 3;
        }

        /* =====================================================
        ÁREA DOS PREÇOS
        ===================================================== */

        .area-precos {
            position: absolute;

            top: 780px;
            left: 240px;

            z-index: 4;
        }


        /* =====================================================
        PREÇO ANTERIOR
        ===================================================== */

        .preco-anterior {
            font-family: Arial, Helvetica, sans-serif;

            font-size: 30px;

            font-weight: 400;

            color: #777777;

            text-decoration: line-through;

            margin-bottom: 5px;
        }


        /* =====================================================
        PREÇO ATUAL
        ===================================================== */

        .preco-atual {
            font-family: Arial, Helvetica, sans-serif;

            font-size: 62px;

            font-weight: 550;

            line-height: 1;

            color: #07194a;
        }


        /* =====================================================
           BADGE DE DESCONTO
           ===================================================== */

        .badge-desconto {
            position: absolute;

            /*
             * POSIÇÃO
             */

            top: 900px;
            right: 70px;


            /*
             * TAMANHO
             */

            width: 220px;
            height: 220px;


            /*
             * FORMATO
             */

            border-radius: 50%;


            /*
             * COR
             */

            background: #69d313;

            color: #07194a;


            /*
             * CENTRALIZA O CONTEÚDO
             */

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;


            /*
             * BORDA
             */

            border: 8px solid #ffffff;

            box-shadow:
                0 0 0 6px #69d313;


            /*
             * LEVE INCLINAÇÃO
             */

            transform: rotate(-7deg);

            z-index: 5;
        }


        /* =====================================================
           NÚMERO DO DESCONTO
           ===================================================== */

        .porcentagem {
            font-family: Arial, Helvetica, sans-serif;

            font-size: 62px;

            font-weight: 900;

            line-height: 0.9;
        }


        /* =====================================================
           TEXTO "OFF"
           ===================================================== */

        .texto-desconto {
            margin-top: 12px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 24px;

            font-weight: 900;

            text-transform: uppercase;

            line-height: 1;
        }


        /* =====================================================
           DETALHE DO BADGE
           ===================================================== */

        .detalhe-badge {
            position: absolute;

            top: 18px;
            right: 25px;

            font-size: 30px;
        }

    </style>

</head>


<body>

    <div class="arte">


        <!-- =================================================
             PLANO DE FUNDO
             ================================================= -->

        <img
            class="plano-fundo"
            src="static/img/instagram/Post.png"
            alt=""
        >


        <!-- =================================================
             IMAGEM DO PRODUTO
             ================================================= -->

        <div class="area-produto">

            <img
                class="imagem-produto"
                src="{{ imagem }}"
                alt=""
            >

        </div>


        <!-- =================================================
             DESCRIÇÃO DO PRODUTO
             ================================================= -->

        <div class="descricao-produto">
            {{ nome }}
        </div>


        <!-- =================================================
             PREÇOS
             ================================================= -->

        <div class="area-precos">

            {% if preco_antigo and preco_antigo > preco_atual %}

                <div class="preco-anterior">
                    R$ {{ "%.2f"|format(preco_antigo)|replace(".", ",") }}
                </div>

            {% endif %}


            <div class="preco-atual">
                R$ {{ "%.2f"|format(preco_atual)|replace(".", ",") }}
            </div>

        </div>


        <!-- =================================================
             DESCONTO
             Só aparece se houver desconto.
             ================================================= -->

        {% if desconto and desconto > 0 %}

            <div class="badge-desconto">

                <div class="detalhe-badge">
                    ✦
                </div>

                <div class="porcentagem">
                    {{ desconto|round|int }}%
                </div>

                <div class="texto-desconto">
                    OFF
                </div>

            </div>

        {% endif %}


    </div>

</body>

</html>
